name: Hörbuch TTS

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Kapiteltext"
        required: true
        type: string
      filename:
        description: "Dateiname ohne Endung"
        required: true
        default: "kapitel"
        type: string
      voice:
        description: "OpenAI Stimme"
        required: true
        default: "alloy"
        type: choice
        options:
          - alloy
          - echo
          - fable
          - onyx
          - nova
          - shimmer

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Prüfe API Secret
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::GitHub Secret OPENAI_API_KEY fehlt."
            exit 1
          fi

      - name: Erzeuge MP3
        shell: python
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INPUT_TEXT: ${{ inputs.text }}
          OUTPUT_NAME: ${{ inputs.filename }}
          VOICE: ${{ inputs.voice }}
        run: |
          import json, os, re, urllib.request, urllib.error

          text = os.environ["INPUT_TEXT"].strip()
          if not text:
              raise SystemExit("Kapiteltext ist leer.")

          name = re.sub(r"[^A-Za-z0-9._-]+", "_", os.environ["OUTPUT_NAME"]).strip("._") or "kapitel"
          # Lange Kapitel automatisch in sichere Textblöcke teilen.
          limit = 3500
          chunks = []
          rest = text
          while rest:
              if len(rest) <= limit:
                  chunks.append(rest)
                  break
              cut = max(rest.rfind("\n", 0, limit), rest.rfind(". ", 0, limit))
              if cut < limit // 2:
                  cut = limit
              chunks.append(rest[:cut + 1].strip())
              rest = rest[cut + 1:].strip()

          os.makedirs("output", exist_ok=True)
          parts = []
          for i, chunk in enumerate(chunks, 1):
              body = json.dumps({
                  "model": "gpt-4o-mini-tts",
                  "voice": os.environ["VOICE"],
                  "input": chunk,
                  "response_format": "mp3"
              }).encode("utf-8")
              req = urllib.request.Request(
                  "https://api.openai.com/v1/audio/speech",
                  data=body,
                  headers={
                      "Authorization": "Bearer " + os.environ["OPENAI_API_KEY"],
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req, timeout=180) as response:
                      audio = response.read()
              except urllib.error.HTTPError as e:
                  detail = e.read().decode("utf-8", "replace")
                  raise SystemExit(f"OpenAI API Fehler {e.code}: {detail}")
              part = f"output/{name}_part_{i:03d}.mp3"
              with open(part, "wb") as fh:
                  fh.write(audio)
              parts.append(part)
              print(f"Teil {i}/{len(chunks)} erstellt.")

          with open("output/concat.txt", "w", encoding="utf-8") as fh:
              for part in parts:
                  fh.write("file '" + os.path.basename(part) + "'\n")
          print(f"{len(parts)} Audioteile bereit zum Zusammenführen.")

      - name: Kapitelteile zusammenführen
        shell: bash
        run: |
          cd output
          ffmpeg -f concat -safe 0 -i concat.txt -c copy "${{ inputs.filename }}.mp3"
          rm -f *_part_*.mp3 concat.txt

      - name: Hörbuchdatei bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: hoerbuch-${{ inputs.filename }}
          path: output/*.mp3
          if-no-files-found: error
          retention-days: 30
