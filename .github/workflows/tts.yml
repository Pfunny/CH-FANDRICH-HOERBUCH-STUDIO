name: Hörbuch Sprachgenerator

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Text für die Sprachausgabe"
        required: true
        type: string
      voice:
        description: "Sprecherprofil"
        required: true
        default: "Erzählerin – warm (Kore)"
        type: choice
        options:
          - "Erzählerin – warm (Kore)"
          - "Erzähler – freundlich (Puck)"
          - "Erzähler – tief/ruhig (Charon)"
          - "Männliche Figur – kraftvoll (Fenrir)"
          - "Weibliche Figur – hell (Aoede)"
          - "Junge Figur – lebendig (Puck)"
          - "Ältere Figur – ruhig (Charon)"
          - "Magische Figur – geheimnisvoll (Kore)"
      mode:
        description: "Produktionsmodus"
        required: true
        default: "Automatisch – mehrere Rollen"
        type: choice
        options:
          - "Automatisch – mehrere Rollen"
          - "Komplettes Buch – Kapitel + Master"
          - "Ein Sprecher"
      format:
        description: "Audioformat"
        required: true
        default: "mp3"
        type: choice
        options:
          - mp3
          - wav
      filename:
        description: "Dateiname ohne Endung"
        required: true
        default: "hoerbuch-track"
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Gemini API-Schlüssel prüfen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GitHub Secret GEMINI_API_KEY fehlt."
            exit 1
          fi

      - name: Textdatei vorbereiten
        env:
          TTS_TEXT: ${{ inputs.text }}
        run: printf '%s' "$TTS_TEXT" > input.txt

      - name: FFmpeg installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Gemini Sprache erzeugen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICE: ${{ inputs.voice }}
          FORMAT: ${{ inputs.format }}
          FILENAME: ${{ inputs.filename }}
          MODE: ${{ inputs.mode }}
        run: |
          python3 -m pip install --quiet --upgrade google-genai
          python3 - <<'PY'
          import os, pathlib, re, subprocess, time
          from google import genai

          text = pathlib.Path("input.txt").read_text(encoding="utf-8").strip()
          if not text:
              raise SystemExit("Kein Text für die Sprachausgabe vorhanden.")

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          fmt = os.environ["FORMAT"].lower()
          mode = os.environ.get("MODE", "Ein Sprecher")
          safe = re.sub(r"[^A-Za-z0-9_-]+", "_", os.environ["FILENAME"]).strip("_") or "hoerbuch-track"

          profiles = {
              "Erzählerin – warm (Kore)": ("Kore", "warm, ruhig, natürlich und geborgen"),
              "Erzähler – freundlich (Puck)": ("Puck", "freundlich, klar und angenehm"),
              "Erzähler – tief/ruhig (Charon)": ("Charon", "tief, ruhig, souverän und atmosphärisch"),
              "Männliche Figur – kraftvoll (Fenrir)": ("Fenrir", "kraftvoll, männlich und ausdrucksstark"),
              "Weibliche Figur – hell (Aoede)": ("Aoede", "hell, freundlich, weiblich und lebendig"),
              "Junge Figur – lebendig (Puck)": ("Puck", "jung, lebendig, neugierig und emotional"),
              "Ältere Figur – ruhig (Charon)": ("Charon", "älter wirkend, ruhig, weise und bedächtig"),
              "Magische Figur – geheimnisvoll (Kore)": ("Kore", "geheimnisvoll, sanft, magisch und atmosphärisch"),
          }

          def role_profile(role, index):
              r = role.casefold()
              if r in ("erzähler", "erzaehler", "narrator"):
                  return ("Charon", "ruhiger, warmer professioneller deutscher Hörbuch-Erzähler")
              if any(x in r for x in ("mutter","mama","frau","mädchen","maedchen","mira","luna","oma","königin","koenigin","hexe","fee")):
                  return ("Aoede", "natürliche weibliche deutsche Figurenstimme; emotional und klar")
              if any(x in r for x in ("wächter","waechter","vater","papa","mann","könig","koenig","meister","lehrer","onkel")):
                  return ("Fenrir", "markante männliche deutsche Figurenstimme; natürlich und charaktervoll")
              if any(x in r for x in ("kind","junge","elias","lumi","schüler","schueler")):
                  return ("Puck", "junge, lebendige deutsche Figurenstimme; neugierig und natürlich")
              cycle=[
                  ("Kore","sanfte, geheimnisvolle deutsche Figurenstimme"),
                  ("Puck","lebendige, freundliche deutsche Figurenstimme"),
                  ("Fenrir","kräftige, charaktervolle deutsche Figurenstimme"),
                  ("Aoede","helle, natürliche deutsche Figurenstimme"),
                  ("Charon","tiefe, ruhige deutsche Figurenstimme"),
              ]
              return cycle[index % len(cycle)]

          def synth(segment_text, voice, style, outpath):
              response = client.models.generate_content(
                  model="gemini-3.8-flash-tts",
                  contents=[{"role":"user","parts":[{
                      "text": segment_text,
                      "speech_metadata":{"style":f"Sprich auf Deutsch. {style}. Hochwertige Hörbuchproduktion. Lies nur den Text vor, ohne Rollennamen oder Regieanweisungen."}
                  }]}],
                  config={"response_modalities":["AUDIO"],"speech_config":{"voice_config":{"voice":voice}}},
              )
              try:
                  audio=response.candidates[0].content.parts[0].inline_data.data
              except Exception as exc:
                  raise RuntimeError(f"Keine Audiodaten für Segment: {exc}") from exc
              pathlib.Path(outpath).write_bytes(audio)

          if mode.startswith("Komplettes Buch"):
              # Kapitelüberschriften erkennen: "Kapitel 1", "Kapitel 2 – Titel", usw.
              chapter_re=re.compile(r"(?im)^\s*(Kapitel\s+\d+(?:\s*[-–—:]\s*[^\n]+)?)\s*$")
              matches=list(chapter_re.finditer(text))
              if matches:
                  chapters=[]
                  pre=text[:matches[0].start()].strip()
                  if pre:
                      chapters.append(("Vorspann",pre))
                  for i,m in enumerate(matches):
                      start=m.end()
                      end=matches[i+1].start() if i+1<len(matches) else len(text)
                      body=text[start:end].strip()
                      if body:
                          chapters.append((m.group(1).strip(),body))
              else:
                  chapters=[("Kapitel 1",text)]

              outdir=pathlib.Path("kapitel")
              outdir.mkdir(exist_ok=True)
              chapter_mp3s=[]
              manifest=["CH.FANDRICH Hörbuchstudio – Kapitelproduktion",""]
              profile=os.environ["VOICE"]
              voice,style=profiles.get(profile,("Kore","warm, natürlich und professionell"))

              for idx,(title,body) in enumerate(chapters,1):
                  # Für jedes Kapitel Rollen wie im Mehrsprecher-Modus erkennen.
                  segments=[]
                  current_role="Erzähler"
                  for raw in body.splitlines():
                      line=raw.strip()
                      if not line:
                          continue
                      m=re.match(r"^([^:\n]{1,40}):\s*(.+)$",line)
                      if m:
                          current_role=m.group(1).strip()
                          spoken=m.group(2).strip()
                      else:
                          spoken=line
                      if segments and segments[-1][0]==current_role:
                          segments[-1]=(current_role,segments[-1][1]+" "+spoken)
                      else:
                          segments.append((current_role,spoken))

                  role_order=[]
                  for role,_ in segments:
                      if role not in role_order:
                          role_order.append(role)
                  role_map={role:role_profile(role,i) for i,role in enumerate(role_order)}
                  segfiles=[]
                  for si,(role,spoken) in enumerate(segments):
                      rv,rs=role_map[role]
                      p=outdir/f"tmp_{idx:03d}_{si:04d}.wav"
                      synth(spoken,rv,rs,str(p))
                      segfiles.append(p)
                      time.sleep(0.15)

                  pause=outdir/f"pause_{idx:03d}.wav"
                  subprocess.run(["ffmpeg","-y","-f","lavfi","-i","anullsrc=r=24000:cl=mono","-t","0.35","-c:a","pcm_s16le",str(pause)],check=True)
                  concat=outdir/f"concat_{idx:03d}.txt"
                  lines=[]
                  for si,p in enumerate(segfiles):
                      lines.append(f"file '{p.resolve()}'")
                      if si<len(segfiles)-1:
                          lines.append(f"file '{pause.resolve()}'")
                  concat.write_text("\n".join(lines)+"\n",encoding="utf-8")
                  wav=outdir/f"{idx:02d}_{re.sub(r'[^A-Za-z0-9_-]+','_',title).strip('_')}.wav"
                  subprocess.run(["ffmpeg","-y","-f","concat","-safe","0","-i",str(concat),"-ar","24000","-ac","1","-c:a","pcm_s16le",str(wav)],check=True)
                  mp3=outdir/(wav.stem+".mp3")
                  subprocess.run(["ffmpeg","-y","-i",str(wav),"-codec:a","libmp3lame","-b:a","192k",str(mp3)],check=True)
                  chapter_mp3s.append(mp3)
                  manifest.append(f"{idx:02d}. {title} – Rollen: "+", ".join(role_order))
                  for p in segfiles: p.unlink(missing_ok=True)
                  pause.unlink(missing_ok=True); concat.unlink(missing_ok=True); wav.unlink(missing_ok=True)

              masterlist=pathlib.Path("master_concat.txt")
              masterlist.write_text("\n".join(f"file '{p.resolve()}'" for p in chapter_mp3s)+"\n",encoding="utf-8")
              out=pathlib.Path(safe+".mp3")
              subprocess.run(["ffmpeg","-y","-f","concat","-safe","0","-i",str(masterlist),"-codec:a","libmp3lame","-b:a","192k",str(out)],check=True)
              masterlist.unlink(missing_ok=True)
              pathlib.Path(safe+"_kapitel.txt").write_text("\n".join(manifest)+"\n",encoding="utf-8")

          elif mode.startswith("Automatisch"):
              # Zeilen im Format "Rollenname: Text" erkennen.
              segments=[]
              current_role="Erzähler"
              for raw in text.splitlines():
                  line=raw.strip()
                  if not line:
                      continue
                  m=re.match(r"^([^:\n]{1,40}):\s*(.+)$",line)
                  if m:
                      current_role=m.group(1).strip()
                      spoken=m.group(2).strip()
                  else:
                      spoken=line
                  if segments and segments[-1][0]==current_role:
                      segments[-1]=(current_role,segments[-1][1]+" "+spoken)
                  else:
                      segments.append((current_role,spoken))
              if not segments:
                  raise SystemExit("Keine sprechbaren Textsegmente gefunden.")

              role_order=[]
              for role,_ in segments:
                  if role not in role_order:
                      role_order.append(role)
              role_map={role:role_profile(role,i) for i,role in enumerate(role_order)}
              print("Erkannte Rollen:", ", ".join(role_order))
              for role,(v,_) in role_map.items():
                  print(f"  {role} -> {v}")

              files=[]
              for i,(role,spoken) in enumerate(segments):
                  voice,style=role_map[role]
                  p=f"segment_{i:04d}.wav"
                  synth(spoken,voice,style,p)
                  files.append(p)
                  time.sleep(0.15)

              # Rollenübersicht für die Produktion speichern.
              role_lines=["CH.FANDRICH Hörbuchstudio – Sprecherbelegung", ""]
              for role,(v,style) in role_map.items():
                  role_lines.append(f"{role}: {v} – {style}")
              pathlib.Path(safe+"_sprecher.txt").write_text("\n".join(role_lines)+"\n",encoding="utf-8")

              # Echte natürliche Pause zwischen Sprecherwechseln erzeugen.
              # 350 ms hält Dialoge flüssig, ohne dass die Stimmen hart aneinanderstoßen.
              pause="speaker_pause.wav"
              subprocess.run([
                  "ffmpeg","-y","-f","lavfi","-i",
                  "anullsrc=r=24000:cl=mono","-t","0.35",
                  "-c:a","pcm_s16le",pause
              ],check=True)

              concat=[]
              for i,p in enumerate(files):
                  concat.append(f"file '{p}'")
                  if i < len(files)-1:
                      concat.append(f"file '{pause}'")
              pathlib.Path("concat.txt").write_text("\n".join(concat)+"\n",encoding="utf-8")
              merged=safe+"_merged.wav"
              # Neu kodieren, damit unterschiedliche Segment-Header/Audioeigenschaften
              # zuverlässig in eine saubere Masterdatei überführt werden.
              subprocess.run([
                  "ffmpeg","-y","-f","concat","-safe","0","-i","concat.txt",
                  "-ar","24000","-ac","1","-c:a","pcm_s16le",merged
              ],check=True)
              if fmt=="mp3":
                  out=pathlib.Path(safe+".mp3")
                  subprocess.run(["ffmpeg","-y","-i",merged,"-codec:a","libmp3lame","-b:a","192k",str(out)],check=True)
              else:
                  out=pathlib.Path(safe+".wav")
                  pathlib.Path(merged).replace(out)
              for p in files:
                  pathlib.Path(p).unlink(missing_ok=True)
              pathlib.Path(merged).unlink(missing_ok=True)
              pathlib.Path("concat.txt").unlink(missing_ok=True)
              pathlib.Path(pause).unlink(missing_ok=True)
          else:
              profile=os.environ["VOICE"]
              voice,style=profiles.get(profile,("Kore","warm, natürlich und professionell"))
              wav=pathlib.Path(safe+".wav")
              synth(text,voice,style,wav)
              if fmt=="mp3":
                  out=pathlib.Path(safe+".mp3")
                  subprocess.run(["ffmpeg","-y","-i",str(wav),"-codec:a","libmp3lame","-b:a","192k",str(out)],check=True)
                  wav.unlink(missing_ok=True)
              else:
                  out=wav

          print("Erzeugt:", out, out.stat().st_size, "Bytes")
          PY

      - name: Audiodatei bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: hoerbuch-audio
          path: |
            *.mp3
            *.wav
            *_sprecher.txt
            *_kapitel.txt
            kapitel/*.mp3
          if-no-files-found: error
          retention-days: 30
