name: Hörbuch Sprachgenerator

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Text für die Sprachausgabe"
        required: true
        type: string
      voice:
        description: "Sprecherprofil"
        required: true
        default: "Erzählerin – warm (Kore)"
        type: choice
        options:
          - "Erzählerin – warm (Kore)"
          - "Erzähler – freundlich (Puck)"
          - "Erzähler – tief/ruhig (Charon)"
          - "Männliche Figur – kraftvoll (Fenrir)"
          - "Weibliche Figur – hell (Aoede)"
          - "Junge Figur – lebendig (Puck)"
          - "Ältere Figur – ruhig (Charon)"
          - "Magische Figur – geheimnisvoll (Kore)"
      format:
        description: "Audioformat"
        required: true
        default: "mp3"
        type: choice
        options:
          - mp3
          - wav
      filename:
        description: "Dateiname ohne Endung"
        required: true
        default: "hoerbuch-track"
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Gemini API-Schlüssel prüfen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GitHub Secret GEMINI_API_KEY fehlt."
            exit 1
          fi

      - name: Textdatei vorbereiten
        env:
          TTS_TEXT: ${{ inputs.text }}
        run: printf '%s' "$TTS_TEXT" > input.txt

      - name: FFmpeg installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Gemini Sprache erzeugen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICE: ${{ inputs.voice }}
          FORMAT: ${{ inputs.format }}
          FILENAME: ${{ inputs.filename }}
        run: |
          python3 -m pip install --quiet --upgrade google-genai
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          from google import genai

          text = pathlib.Path("input.txt").read_text(encoding="utf-8").strip()
          if not text:
              raise SystemExit("Kein Text für die Sprachausgabe vorhanden.")

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          profile = os.environ["VOICE"]
          voice_map = {
              "Erzählerin – warm (Kore)": ("Kore", "warm, ruhig, natürlich und geborgen; professionelle deutsche Hörbuch-Erzählerin"),
              "Erzähler – freundlich (Puck)": ("Puck", "freundlicher, natürlicher deutscher Hörbuch-Erzähler; klar und angenehm"),
              "Erzähler – tief/ruhig (Charon)": ("Charon", "tiefe, ruhige, souveräne deutsche Erzählerstimme; langsamer und atmosphärisch"),
              "Männliche Figur – kraftvoll (Fenrir)": ("Fenrir", "kraftvolle männliche deutsche Figurenstimme; ausdrucksstark, aber natürlich"),
              "Weibliche Figur – hell (Aoede)": ("Aoede", "helle, freundliche weibliche deutsche Figurenstimme; lebendig und natürlich"),
              "Junge Figur – lebendig (Puck)": ("Puck", "junge, lebendige deutsche Figurenstimme; neugierig, freundlich und emotional"),
              "Ältere Figur – ruhig (Charon)": ("Charon", "älter wirkende, ruhige und weise deutsche Figurenstimme; warm und bedächtig"),
              "Magische Figur – geheimnisvoll (Kore)": ("Kore", "geheimnisvolle, sanfte deutsche Fantasy-Figurenstimme; magisch und atmosphärisch"),
          }
          voice, role_style = voice_map.get(profile, ("Kore", "warm, natürlich und professionell"))
          fmt = os.environ["FORMAT"].lower()
          safe = re.sub(r"[^A-Za-z0-9_-]+", "_", os.environ["FILENAME"]).strip("_") or "hoerbuch-track"

          response = client.models.generate_content(
              model="gemini-3.8-flash-tts",
              contents=[{
                  "role": "user",
                  "parts": [{
                      "text": text,
                      "speech_metadata": {
                          "style": f"Sprich auf Deutsch. {role_style}. Hochwertige Hörbuchproduktion. Lies ausschließlich den eigentlichen Text vor und keine Regieanweisungen."
                      },
                  }],
              }],
              config={
                  "response_modalities": ["AUDIO"],
                  "speech_config": {
                      "voice_config": {"voice": voice}
                  },
              },
          )

          try:
              audio = response.candidates[0].content.parts[0].inline_data.data
          except Exception as exc:
              raise RuntimeError(f"Gemini hat keine Audiodaten zurückgegeben: {exc}") from exc

          if not audio:
              raise RuntimeError("Gemini hat keine Audiodaten zurückgegeben.")

          wav = pathlib.Path(safe + ".wav")
          wav.write_bytes(audio)

          if fmt == "mp3":
              out = pathlib.Path(safe + ".mp3")
              subprocess.run([
                  "ffmpeg", "-y", "-i", str(wav),
                  "-codec:a", "libmp3lame", "-b:a", "192k",
                  str(out)
              ], check=True)
              wav.unlink(missing_ok=True)
          else:
              out = wav

          print("Erzeugt:", out, out.stat().st_size, "Bytes")
          PY

      - name: Audiodatei bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: hoerbuch-audio
          path: |
            *.mp3
            *.wav
          if-no-files-found: error
          retention-days: 30
