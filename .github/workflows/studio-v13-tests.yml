name: Studio 13 Qualitätsprüfung
on:
  push:
    branches:
      - feature/studio-v13-kokoro-voices
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/kokoro-local.yml'
      - '.github/workflows/studio-v13-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Manuskript- und UI-Tests
        run: python -m unittest discover -s tests -v
      - name: Kokoro Workflow YAML prüfen
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          import yaml
          from pathlib import Path
          with Path(".github/workflows/kokoro-local.yml").open(encoding="utf-8") as f:
              workflow=yaml.safe_load(f)
          inputs=workflow.get("on",workflow.get(True,{}))["workflow_dispatch"]["inputs"]
          assert "speaker_voices" in inputs
          assert "pronunciation_rules" in inputs
          print("Kokoro Eingabefelder OK")
          PY
