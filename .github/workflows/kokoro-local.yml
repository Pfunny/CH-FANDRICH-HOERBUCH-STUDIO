name: Hörbuch Kokoro Cloud

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Text oder Buchtext"
        required: true
        type: string
      mode:
        description: "Produktionsmodus"
        required: true
        default: "Automatisch – mehrere Rollen"
        type: choice
        options:
          - "Ein Sprecher"
          - "Automatisch – mehrere Rollen"
          - "Komplettes Buch – Kapitel + Master"
      voice:
        description: "Hauptstimme / Erzähler"
        required: true
        default: "af_heart"
        type: choice
        options:
          - af_heart
          - af_bella
          - af_nicole
          - am_adam
          - am_michael
      book_title:
        description: "Buchtitel"
        required: true
        default: "Die Chroniken von Goldtal"
        type: string
      author:
        description: "Autor"
        required: true
        default: "Christopher Fandrich"
        type: string
      intro_outro:
        description: "Intro und Outro sprechen"
        required: true
        default: true
        type: boolean
      filename:
        description: "Dateiname ohne Endung"
        required: true
        default: "kokoro-hoerbuch"
        type: string

permissions:
  contents: read

jobs:
  kokoro-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: FFmpeg installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: KokoroTTS in GitHub starten
        run: |
          docker compose -f docker-compose.kokoro.yml up -d
          echo "Warte auf KokoroTTS..."
          for i in {1..60}; do
            if curl --silent --max-time 5 http://127.0.0.1:7860/ >/dev/null 2>&1; then
              echo "KokoroTTS ist bereit."
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.kokoro.yml logs --tail=100 || true
          echo "::error::KokoroTTS konnte nicht gestartet werden."
          exit 1

      - name: Text vorbereiten
        env:
          TTS_TEXT: ${{ inputs.text }}
        run: printf '%s' "$TTS_TEXT" > input.txt

      - name: Hörbuch produzieren
        env:
          MODE: ${{ inputs.mode }}
          VOICE: ${{ inputs.voice }}
          FILENAME: ${{ inputs.filename }}
          BOOK_TITLE: ${{ inputs.book_title }}
          AUTHOR: ${{ inputs.author }}
          INTRO_OUTRO: ${{ inputs.intro_outro }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, urllib.request

          text=pathlib.Path("input.txt").read_text(encoding="utf-8").strip()
          if not text: raise SystemExit("Kein Text vorhanden.")
          mode=os.environ["MODE"]; narrator=os.environ["VOICE"]
          book_title=os.environ.get("BOOK_TITLE","Hörbuch").strip() or "Hörbuch"
          author=os.environ.get("AUTHOR","Christopher Fandrich").strip() or "Christopher Fandrich"
          intro_outro=os.environ.get("INTRO_OUTRO","true").lower()=="true"
          safe=re.sub(r"[^A-Za-z0-9_-]+","_",os.environ["FILENAME"]).strip("_") or "kokoro-hoerbuch"
          outdir=pathlib.Path("output"); outdir.mkdir(exist_ok=True)

          voices=[narrator,"af_bella","am_adam","af_nicole","am_michael"]
          role_voice={"erzähler":narrator,"erzaehler":narrator,"narrator":narrator}
          def voice_for(role):
              import hashlib
              k=role.casefold().strip()
              if k in role_voice: return role_voice[k]
              # Stabil über das gesamte Buch und auch zwischen neuen Läufen:
              # derselbe Rollenname erhält immer dieselbe Stimme.
              digest=int(hashlib.sha256(k.encode("utf-8")).hexdigest()[:8],16)
              candidates=[v for v in voices if v != narrator] or voices
              v=candidates[digest % len(candidates)]
              role_voice[k]=v
              return v

          def tts(spoken,voice,path):
              payload=json.dumps({"model":"kokoro","input":spoken,"voice":voice,"response_format":"wav","speed":1.0}).encode()
              req=urllib.request.Request("http://127.0.0.1:7860/v1/audio/speech",data=payload,headers={"Content-Type":"application/json"},method="POST")
              with urllib.request.urlopen(req,timeout=600) as r: path.write_bytes(r.read())
              if not path.exists() or path.stat().st_size<1000: raise RuntimeError("Kokoro lieferte keine gültige Audiodatei.")

          def segments(body,multi=True):
              if not multi: return [("Erzähler",body)]
              out=[]; role="Erzähler"
              for raw in body.splitlines():
                  line=raw.strip()
                  if not line: continue
                  m=re.match(r"^([^:\n]{1,40}):\s*(.+)$",line)
                  if m: role,spoken=m.group(1).strip(),m.group(2).strip()
                  else: spoken=line
                  if out and out[-1][0]==role: out[-1]=(role,out[-1][1]+" "+spoken)
                  else: out.append((role,spoken))
              return out

          def render(parts,stem):
              wavs=[]
              for i,(role,spoken) in enumerate(parts):
                  p=outdir/f"{stem}_seg_{i:04d}.wav"
                  tts(spoken,voice_for(role),p); wavs.append(p)
              pause=outdir/f"{stem}_pause.wav"
              subprocess.run(["ffmpeg","-loglevel","error","-y","-f","lavfi","-i","anullsrc=r=24000:cl=mono","-t","0.35","-c:a","pcm_s16le",str(pause)],check=True)
              lst=outdir/f"{stem}.txt"; lines=[]
              for i,p in enumerate(wavs):
                  lines.append(f"file '{p.resolve()}'")
                  if i<len(wavs)-1: lines.append(f"file '{pause.resolve()}'")
              lst.write_text("\n".join(lines)+"\n")
              raw=outdir/f"{stem}_raw.wav"
              subprocess.run(["ffmpeg","-loglevel","error","-y","-f","concat","-safe","0","-i",str(lst),"-ar","24000","-ac","1","-c:a","pcm_s16le",str(raw)],check=True)
              mp3=outdir/f"{stem}.mp3"
              subprocess.run(["ffmpeg","-loglevel","error","-y","-i",str(raw),"-af","loudnorm=I=-19:LRA=7:TP=-2","-codec:a","libmp3lame","-b:a","192k",str(mp3)],check=True)
              for p in wavs+[pause,raw,lst]: p.unlink(missing_ok=True)
              return mp3

          chapters=[]
          if mode.startswith("Komplettes Buch"):
              rx=re.compile(r"(?im)^\s*(Kapitel\s+\d+(?:\s*[-–—:]\s*[^\n]+)?)\s*$")
              ms=list(rx.finditer(text))
              if ms:
                  for i,m in enumerate(ms):
                      body=text[m.end():ms[i+1].start() if i+1<len(ms) else len(text)].strip()
                      if body: chapters.append((m.group(1),body))
              else: chapters=[("Kapitel 1",text)]
              chapter_files=[]
              master_parts=[]
              # Intro
              if intro_outro:
                  intro=render([("Erzähler",f"{book_title}. Ein Hörbuch von {author}.")],"00_intro")
                  master_parts.append(intro)

              chapter_pause=outdir/"chapter_pause.wav"
              subprocess.run(["ffmpeg","-loglevel","error","-y","-f","lavfi","-i","anullsrc=r=24000:cl=mono","-t","1.5","-c:a","pcm_s16le",str(chapter_pause)],check=True)
              chapter_pause_mp3=outdir/"chapter_pause.mp3"
              subprocess.run(["ffmpeg","-loglevel","error","-y","-i",str(chapter_pause),"-codec:a","libmp3lame","-b:a","192k",str(chapter_pause_mp3)],check=True)
              chapter_pause.unlink(missing_ok=True)

              for i,(title,body) in enumerate(chapters,1):
                  # Kapitelansage wird mit derselben Erzählerstimme gesprochen.
                  announcement=render([("Erzähler",title)],f"{i:02d}_ansage")
                  content=render(segments(body,True),f"{i:02d}_kapitel")
                  # Eine vollständige Kapiteldatei inklusive Ansage erzeugen.
                  cl=outdir/f"{i:02d}_chapter_concat.txt"
                  cl.write_text(f"file '{announcement.resolve()}'\nfile '{content.resolve()}'\n")
                  chapter=outdir/f"{i:02d}_komplett.mp3"
                  subprocess.run(["ffmpeg","-loglevel","error","-y","-f","concat","-safe","0","-i",str(cl),"-codec:a","libmp3lame","-b:a","192k","-metadata",f"title={title}","-metadata",f"artist={author}","-metadata",f"album={book_title}",str(chapter)],check=True)
                  cl.unlink(missing_ok=True)
                  chapter_files.append(chapter)
                  master_parts.extend([chapter,chapter_pause_mp3])

              if intro_outro:
                  outro=render([("Erzähler",f"Du hast {book_title} gehört. Geschrieben von {author}. Ende.")],"99_outro")
                  master_parts.append(outro)
              elif master_parts and master_parts[-1] == chapter_pause_mp3:
                  master_parts.pop()

              ml=outdir/"master.txt"
              ml.write_text("\n".join(f"file '{p.resolve()}'" for p in master_parts)+"\n")
              final=pathlib.Path(safe+".mp3")
              subprocess.run(["ffmpeg","-loglevel","error","-y","-f","concat","-safe","0","-i",str(ml),"-af","loudnorm=I=-19:LRA=7:TP=-2","-codec:a","libmp3lame","-b:a","192k","-metadata",f"title={book_title}","-metadata",f"artist={author}","-metadata",f"album={book_title}","-metadata","genre=Audiobook",str(final)],check=True)
              ml.unlink(missing_ok=True)
          else:
              multi=mode.startswith("Automatisch")
              produced=render(segments(text,multi),"track")
              final=pathlib.Path(safe+".mp3"); produced.replace(final)

          manifest=["CH.FANDRICH Hörbuchstudio – Kokoro Cloud","",f"Titel: {book_title}",f"Autor: {author}",f"Modus: {mode}",f"Intro/Outro: {'Ja' if intro_outro else 'Nein'}","", "Sprecherbelegung:"]
          manifest += [f"{role}: {voice}" for role,voice in role_voice.items()]
          pathlib.Path(safe+"_produktion.txt").write_text("\n".join(manifest)+"\n",encoding="utf-8")
          print("Fertig:",final,final.stat().st_size,"Bytes")
          PY

      - name: Hörbuch bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-hoerbuch-audio
          path: |
            *.mp3
            *_produktion.txt
            output/*.mp3
          if-no-files-found: error
          retention-days: 30
